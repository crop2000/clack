[package]
name = "clack-plugin-gain-gui-slint"
version = "0.1.0"
edition = "2024"
license = "GPL-3"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
clack-plugin = { workspace = true }
clack-extensions = { workspace = true, features = [
  "audio-ports",
  "clack-plugin",
  "gui",
  "note-ports",
  "params",
  "raw-window-handle_05",
  "state",
] }
# baseview = { git = "https://github.com/RustAudio/baseview.git", tag = "v0.2", features = [
#   "opengl",
# ] }
#
# this was done with the rwh06 branch!
# baseview = { path = "../../../../baseview", features = ["opengl"] }
baseview = { version = "0.1.4", features = ["opengl"] }
# this was done with the rwh06 branch!
slint-baseview = { git = "https://codeberg.org/crop/slint-baseview.git" }
slint = { version = "=1.17.0", default-features = false, features = [
  "std",
  "renderer-femtovg",
  "raw-window-handle-06",
  "compat-1-2",
] }

[dev-dependencies]
clack-host = { workspace = true, features = ["clack-plugin"] }
clack-extensions = { workspace = true, features = [
  "audio-ports",
  "params",
  "state",
  "clack-plugin",
  "clack-host",
] }

[build-dependencies]
slint-build = "1.17.0"
